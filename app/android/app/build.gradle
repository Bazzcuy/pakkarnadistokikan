plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace = "com.bagas.catokan"
    compileSdk = 34
    // Plugins (app_links, path_provider_android, shared_preferences_android,
    // sqflite_android, url_launcher_android) require NDK 25.1.8937393.
    // Default Flutter NDK (23.1.7779620) is too old → bump to highest required.
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.bagas.catokan"
        minSdk = 21
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Workaround: Flutter Gradle plugin di CI runner kadang gak otomatis nambahin
// flutter_embedding_<mode> ke compile classpath (terlihat di job #14: Kotlin "Unresolved reference: io").
// Tambahin manual sebagai compileOnly biar Java/Kotlin compile bisa resolve io.flutter.*.
// Engine version 1.0.0-a18df97ca57a249df5d8d68cd0820600223ce262 cocok dengan Flutter 3.24.5 stable.
dependencies {
    compileOnly 'io.flutter:flutter_embedding_debug:1.0.0-a18df97ca57a249df5d8d68cd0820600223ce262'
    compileOnly 'io.flutter:flutter_embedding_release:1.0.0-a18df97ca57a249df5d8d68cd0820600223ce262'
}