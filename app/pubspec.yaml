name: catokan
description: "CATOKAN — aplikasi pencatatan stok ikan giling."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.5.6

  # Local DB
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# app_links 6.4.x (Sep 2025+) pindah ke Kotlin DSL + AGP 9.x, gak kompatibel sama
# Flutter 3.24.5 Gradle plugin di CI. supabase_flutter 2.5.6 narik transitif
# '>=6.4.1' — override ke 6.3.3 (Des 2024, Groovy DSL, AGP 8.5.2) yang masih support.
# 6.3.3 butuh Flutter >=3.19 & Dart >=3.3 → Flutter 3.24.5 (Dart 3.5) OK.
dependency_overrides:
  app_links: 6.3.3

flutter:
  uses-material-design: true