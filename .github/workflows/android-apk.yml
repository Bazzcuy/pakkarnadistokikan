name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download gradle-wrapper.jar
        run: |
          curl -L -o app/android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          ls -la app/android/gradle/wrapper/gradle-wrapper.jar

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Show Flutter version
        working-directory: app
        run: flutter --version

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
            ${{ runner.os }}-

      - name: Write local.properties for Flutter SDK path
        working-directory: app/android
        run: |
          echo "flutter.sdk=${FLUTTER_ROOT}" > local.properties
          echo "FLUTTER_ROOT=${FLUTTER_ROOT}"
          cat local.properties

      - name: Verify flutter_tools/gradle exists
        run: |
          ls -la "${FLUTTER_ROOT}/packages/flutter_tools/gradle/" | head -20
          ls -la "${FLUTTER_ROOT}/packages/flutter_tools/gradle/build.gradle.kts" 2>/dev/null || ls -la "${FLUTTER_ROOT}/packages/flutter_tools/gradle/build.gradle" 2>/dev/null || echo 'no build.gradle at flutter_tools/gradle'

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Make gradlew executable
        working-directory: app/android
        run: chmod +x gradlew

      - name: Run analyzer (non-blocking)
        working-directory: app
        run: flutter analyze --no-fatal-infos || echo "::warning::analyzer found non-fatal issues"

      - name: Build debug APK (bypass flutter build apk wrapper — its post-build APK check fails on our settings.gradle plugin-loader hack)
        working-directory: app/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          # dart-defines must be base64(JSON({KEY: VALUE, ...})), NOT raw KEY=VALUE lines
          DART_DEFINES=$(printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' \
            "${SUPABASE_URL:-https://jyabdncgxygacttsturu.supabase.co}" \
            "${SUPABASE_ANON_KEY:-sb_publishable_8sXfhFCqQF1f3MO69JW5FQ_77iS7wk-}" \
            | base64 -w0)
          echo "dart-defines (b64): $DART_DEFINES"
          ./gradlew assembleDebug \
            -Pflutter.sdk=${FLUTTER_ROOT} \
            -Ptarget-platform=android-x64,android-arm64 \
            -Pdart-defines="$DART_DEFINES" \
            2>&1 | tail -200

      - name: Locate APK (Gradle from app/android puts APK at android/build/outputs/apk/debug/)
        working-directory: app/android
        run: |
          echo "===== APKs found ====="
          find . -name '*.apk' -type f
          mkdir -p ../build/app/outputs/flutter-apk
          DEBUG_APK=$(find . -name 'app-debug.apk' -type f | head -1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" ../build/app/outputs/flutter-apk/app-debug.apk
            echo "Copied debug APK to ../build/app/outputs/flutter-apk/app-debug.apk"
          else
            echo "WARNING: no app-debug.apk found"
          fi
          ls -la ../build/app/outputs/flutter-apk/ 2>/dev/null || true

      - name: Build release APK (unsigned) — same approach
        working-directory: app/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          DART_DEFINES=$(printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' \
            "${SUPABASE_URL:-https://jyabdncgxygacttsturu.supabase.co}" \
            "${SUPABASE_ANON_KEY:-sb_publishable_8sXfhFCqQF1f3MO69JW5FQ_77iS7wk-}" \
            | base64 -w0)
          ./gradlew assembleRelease \
            -Pflutter.sdk=${FLUTTER_ROOT} \
            -Ptarget-platform=android-x64,android-arm64 \
            -Pdart-defines="$DART_DEFINES" \
            2>&1 | tail -200 || echo "::warning::release build failed (continuing with debug)"

      - name: Locate release APK
        working-directory: app/android
        run: |
          mkdir -p ../build/app/outputs/flutter-apk
          RELEASE_APK=$(find . -name 'app-release.apk' -type f | head -1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" ../build/app/outputs/flutter-apk/app-release.apk
            echo "Copied release APK"
          else
            echo "WARNING: no app-release.apk found"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: catokan-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: catokan-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Build summary
        if: success()
        run: |
          echo "✅ Build sukses! APK tersedia di Artifacts."
          echo "📥 Download di: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"