name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download gradle-wrapper.jar
        run: |
          curl -L -o app/android/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          ls -la app/android/gradle/wrapper/gradle-wrapper.jar

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        working-directory: app
        run: flutter --version

      - name: Cache pub dependencies
        working-directory: app
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            app/.dart_tool
            app/build
          key: ${{ runner.os }}-pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
            ${{ runner.os }}-

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Make gradlew executable
        working-directory: app/android
        run: chmod +x gradlew

      - name: Run analyzer (non-blocking)
        working-directory: app
        run: flutter analyze --no-fatal-infos || echo "::warning::analyzer found non-fatal issues"

      - name: Build debug APK
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${SUPABASE_URL:-https://blassyztvmsvejinqdy.supabase.co} \
            --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_rJOxklU72bOVTbOnGFCSmg_9lZ99XSP}

      - name: Build release APK (unsigned)
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${SUPABASE_URL:-https://blassyztvmsvejinqdy.supabase.co} \
            --dart-define=SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_rJOxklU72bOVTbOnGFCSmg_9lZ99XSP}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: catokan-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: catokan-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "✅ Build sukses! APK tersedia di Artifacts."
          echo "📥 Download di: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"